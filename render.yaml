# Render Blueprint for the backend API.
# In the Render dashboard: New + > Blueprint > select this repo.
# See DEPLOY.md for the full step-by-step (this only covers the backend;
# the frontend deploys separately to Vercel, and the database is external
# — e.g. Aiven's free MySQL plan — since Render has no managed MySQL).
services:
  - type: web
    name: eventura-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DB_HOST
        sync: false
      # Managed hosts like Aiven assign a random non-standard port per service — don't
      # assume 3306, copy the real port from your provider's connection info.
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: true
      # Required for Aiven: it signs certs with its own project CA, not a publicly-trusted
      # one, so the default tls=true verification mode rejects it. Paste the PEM content of
      # Aiven's "CA certificate" (Overview → Connection information) as this value — see
      # DEPLOY.md. Leave empty for hosts with a publicly-trusted cert (or no TLS at all).
      - key: DB_SSL_CA
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: 72
      # Set this to your Vercel frontend URL once it exists (see DEPLOY.md).
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: PAYMENT_DEADLINE_MINUTES
        value: 120
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: false
